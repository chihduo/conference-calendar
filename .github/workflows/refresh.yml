name: Refresh deadlines

on:
  schedule:
    - cron: '17 3 * * *'      # daily, 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm }
      - run: npm ci

      # Expand the wishlist first, so anything added tonight is also fetched
      # tonight rather than waiting another day.
      # Supabase pauses a free project after 7 days without database activity.
      # A rejected request does not count: this used to read `submissions`, which
      # anon has no grant on, so every ping returned 401 and the pause timer ran
      # down regardless. It reads a table that exists to be readable instead, and
      # insists on 200 - a green step that never worked is worse than a red one,
      # and continue-on-error had been hiding this for a fortnight.
      - name: Keep the Supabase project awake
        if: hashFiles('data/sync-config.json') != ''
        run: |
          URL=$(node -p "require('./data/sync-config.json').url")
          KEY=$(node -p "require('./data/sync-config.json').anonKey")
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
            -H "apikey: $KEY" "$URL/rest/v1/heartbeat?select=ok&limit=1" || echo 000)
          echo "supabase heartbeat: HTTP $code"
          if [ "$code" != "200" ]; then
            # Not fatal - the refresh itself is the point of this job - but it
            # must be visible, since the symptom otherwise appears weeks later
            # as a paused project.
            echo "::warning title=Supabase keep-alive failed::HTTP $code — the pause timer is running. Run supabase/0003-heartbeat.sql, or resume the project if it is already paused."
          fi

      - name: Expand data/wishlist.txt
        run: npm run add | tee add.log

      - name: Fetch every configured source
        run: npm run refresh | tee refresh.log

      # The guards already vetted each edition before it was written; this is the
      # second line of defence. If it trips, nothing is committed and the run fails
      # loudly rather than shipping a bad date.
      - name: Validate what was written
        run: npm run validate

      - name: Commit changes
        run: |
          scripts/ci-commit.sh "chore(data): refresh deadlines $(date -u +%Y-%m-%d)

          $(node -e "const q=require('./data/_review_queue.json');console.log(q.filter(r=>r.severity==='action').length+' item(s) need a decision')")"

      - name: Publish the run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refresh-log
          path: |
            add.log
            refresh.log
            data/_review_queue.json
