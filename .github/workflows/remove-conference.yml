name: Remove conference

# Kept separate from Add rather than folded in as a branch: this path destroys
# hand-curation that no fetcher can rebuild, and its owner gate is worth being
# readable on its own rather than buried in a shared conditional.

on:
  # `labeled` alone: a template-created issue also fires `opened`, which ran
  # every request twice (see add-conference.yml).
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      acronym:
        description: 'Conference acronym to remove, e.g. CIAA'
        required: true
      hide:
        description: 'Hide instead of delete (reversible)'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

jobs:
  remove:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'remove-conference' &&
       github.event.issue.user.login == github.repository_owner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci

      - name: Extract acronym
        id: acro
        env:
          RAW: ${{ github.event.inputs.acronym || github.event.issue.title }}
        run: |
          CLEAN=$(printf '%s' "$RAW" | tr -d '\n' | grep -oE '^[A-Za-z][A-Za-z0-9&+-]{1,15}$' || true)
          if [ -z "$CLEAN" ]; then
            echo "::error::'$RAW' is not a plausible conference acronym"
            printf '標題「%s」不像會議縮寫。標題只放縮寫本身：英文字母開頭、2 到 16 個字元，可以有數字和 & + -（例如 CIAA、S&P）。\n\n改好標題之後，把 `remove-conference` 標籤拿掉再貼一次就會重跑。' "$RAW" > failure.md
            exit 1
          fi
          echo "acronym=$CLEAN" >> "$GITHUB_OUTPUT"

      # Read a ticked checkbox, not a keyword. Matching free text against the
      # whole body is fragile precisely because the form's own chrome is part of
      # that body: the previous version searched for "hide" and the field label
      # said "寫 hide 表示只隱藏不刪除", so every issue matched and nothing was
      # ever deleted. A checkbox renders as `- [x]`, which the template cannot
      # accidentally contain.
      - name: Decide hide vs delete
        id: mode
        env:
          BODY: ${{ github.event.issue.body }}
          INPUT_HIDE: ${{ github.event.inputs.hide }}
        run: |
          if [ "$INPUT_HIDE" = "true" ] || printf '%s' "$BODY" | grep -qE '^[[:space:]]*-[[:space:]]*\[[xX]\]'; then
            echo "flag=--hide" >> "$GITHUB_OUTPUT"
            echo "mode: hide"
          else
            echo "flag=" >> "$GITHUB_OUTPUT"
            echo "mode: delete"
          fi

      - name: Remove
        id: remove
        env:
          ACRONYM: ${{ steps.acro.outputs.acronym }}
        run: |
          set +e
          OUT=$(npm run remove --silent -- "$ACRONYM" ${{ steps.mode.outputs.flag }} 2>&1)
          CODE=$?
          set -e
          echo "$OUT"
          { echo "out<<CCEOF"; echo "$OUT"; echo "CCEOF"; } >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          [ "$CODE" -eq 0 ] || [ "$CODE" -eq 1 ]      # 1 = no such venue, report it rather than failing

      - run: npm run validate
        if: steps.remove.outputs.code == '0'

      - name: Commit
        if: steps.remove.outputs.code == '0'
        env:
          ACRONYM: ${{ steps.acro.outputs.acronym }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          scripts/ci-commit.sh "chore(data): remove $ACRONYM${ISSUE:+ via issue #$ISSUE}"

      - name: Reply on the issue
        if: always() && github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const out = (${{ toJSON(steps.remove.outputs.out) }} || '').toString().trim();
            // Only a clean run counts: a failed validate or commit after a
            // successful removal still means nothing reached main.
            const ok = '${{ steps.remove.outputs.code }}' === '0' && '${{ job.status }}' === 'success';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const why = fs.existsSync('failure.md') ? fs.readFileSync('failure.md', 'utf8').trim() : '';
            const hid = '${{ steps.mode.outputs.flag }}' === '--hide';
            // The wording has to follow the mode: telling someone who just hid a
            // venue that it was "removed", and then advising them to hide it, is
            // both wrong and slightly insulting.
            const head = !ok ? '沒有做任何變更：'
              : hid ? '已隱藏。資料完整保留，以下是它的內容：'
                    : '已刪除。以下是隨檔案一起消失的東西：';
            const undo = !ok ? ''
              : hid
                ? '\n\n要讓它回來：把 `data/conferences/` 底下那個檔案的 `hidden: true` 拿掉即可。'
                : '\n\n還原：`git revert` 這次的 commit，或到 commit 歷史把檔案取回。' +
                  '\n下次只想讓它不顯示的話，在 issue 內文寫 `hide`——檔案與資料會完整保留。';
            // With no output there is nothing to quote; say why instead of an empty block.
            const body = out ? `${head}\n\n\`\`\`\n${out.slice(0, 55000)}\n\`\`\`${undo}`
                             : `${head}\n\n${why || `執行途中出錯。原因看執行紀錄：${runUrl}`}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, body,
            });
            if (ok) await github.rest.issues.update({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, state: 'closed',
            });
