name: Build and deploy

on:
  push:
    branches: [main]
    paths: ['data/**', 'site/**', 'scripts/**', 'schema/**', 'package*.json', '.github/workflows/deploy.yml']
  workflow_dispatch:
  # A push made with GITHUB_TOKEN deliberately triggers no workflow, so the
  # nightly refresh would update the data and never rebuild the site.
  # workflow_run is the documented way to chain across that boundary.
  workflow_run:
    workflows: ["Refresh deadlines"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Never publish on top of a refresh that failed its guards.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm }
      - run: npm ci
      # A schema or guard failure must stop the deploy, not ship broken dates.
      - run: npm run validate
      # A broken mermaid block renders as an error box on GitHub, and the syntax
      # is not something a reviewer reliably catches by eye.
      - run: npm run lint:docs
      - run: npm run build
      # Browser-level checks run against the built page, so they must follow the build.
      - run: npm test
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
