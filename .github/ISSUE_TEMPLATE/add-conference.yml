name: Add a conference
description: Give an acronym; the discovery cascade fills in the rest.
title: 'ACRONYM'
labels: ['add-conference']
body:
  - type: markdown
    attributes:
      value: |
        Put **only the acronym** in the title, e.g. `CONCUR`.
        A workflow will look it up in ICORE, ccf-deadlines, conf.researchr.org
        and WikiCFP, commit the result, and reply here with what it found.

        Nothing is guessed. If something is genuinely a pick-from-a-list — say
        ICORE holds two venues called `FSE` — the bot posts the candidates and
        waits; **reply with the number** and it applies your answer, re-fetches
        and closes. Anything that is not a simple choice comes back as a numbered
        next-steps list naming the file and field to edit.
  - type: textarea
    id: notes
    attributes:
      label: Notes (optional)
      placeholder: Official CFP URL, which track counts as the main one, etc.
